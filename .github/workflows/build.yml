name: Build ApexDrive APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android Build Tools & Platform
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;33.0.2"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Assemble Debug APKs
        run: gradle assembleDebug --stacktrace

      - name: Upload Classic Cockpit APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexDrive-Cockpit-APK
          path: app/build/outputs/apk/cockpit/debug/app-cockpit-debug.apk

      - name: Upload CarPlay Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexDrive-CarPlayBeta-APK
          path: app/build/outputs/apk/carplayBeta/debug/app-carplayBeta-debug.apk
