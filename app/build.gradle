plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apexdrive.launcher'
    compileSdk 33

    defaultConfig {
        applicationId "com.apexdrive.launcher"
        minSdk 21
        targetSdk 28
        // CI passes VERSION_CODE (the run number) so every build is newer than the last.
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1.0.0"
    }

    // Stable signing key from environment variables (CI secrets). Without them the
    // build falls back to the normal debug key. Never commit a keystore or password.
    def signingKeystore = System.getenv("SIGNING_KEYSTORE_FILE")
    def hasSigningKey = signingKeystore != null && file(signingKeystore).exists()
    if (hasSigningKey) {
        signingConfigs {
            ci {
                storeFile file(signingKeystore)
                storePassword System.getenv("SIGNING_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (hasSigningKey) signingConfig signingConfigs.ci
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningKey) signingConfig signingConfigs.ci
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // targetSdk 28 is deliberate for head units; see "Why targetSdk 28" in README.md.
        disable "ExpiredTargetSdkVersion"
        // Report only until the existing errors (see the lint report artifact) are fixed;
        // then remove this line so lint gates CI.
        abortOnError false
    }

    // Views are looked up with findViewById; ViewBinding is not used.
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.2'

    testImplementation 'junit:junit:4.13.2'
}
