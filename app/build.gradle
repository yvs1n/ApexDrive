plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apexdrive.launcher'
    compileSdk 33

    defaultConfig {
        applicationId "com.apexdrive.launcher"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "edition"
    productFlavors {
        cockpit {
            dimension "edition"
            applicationId "com.apexdrive.launcher"
            versionNameSuffix "-cockpit"
            manifestPlaceholders = [
                appName: "ApexDrive",
                cockpitHomeCategory: "android.intent.category.HOME",
                cockpitLauncherCategory: "android.intent.category.LAUNCHER",
                carplayHomeCategory: "android.intent.category.DEFAULT",
                carplayLauncherCategory: "android.intent.category.LAUNCHER"
            ]
        }
        carplayBeta {
            dimension "edition"
            applicationId "com.apexdrive.launcher.carplay"
            versionNameSuffix "-carplay-beta"
            manifestPlaceholders = [
                appName: "CarPlay Beta",
                cockpitHomeCategory: "android.intent.category.DEFAULT",
                cockpitLauncherCategory: "android.intent.category.LAUNCHER",
                carplayHomeCategory: "android.intent.category.HOME",
                carplayLauncherCategory: "android.intent.category.LAUNCHER"
            ]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
}
